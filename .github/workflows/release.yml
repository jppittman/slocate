name: Release

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon only
          - target: aarch64-apple-darwin
            os: macos-latest
            name: slocate-aarch64-apple-darwin

          # Linux — musl for fully static, zero-dependency binaries
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: slocate-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: slocate-aarch64-unknown-linux-musl

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross tool (aarch64 musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: curl -sSfL https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-musl.tar.gz | tar xz && sudo mv cross /usr/local/bin/

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --profile dist --target ${{ matrix.target }}
          else
            cargo build --profile dist --target ${{ matrix.target }}
          fi
        env:
          RUSTFLAGS: -C llvm-args=--enable-unsafe-fp-math

      - name: Package
        run: |
          cd target/${{ matrix.target }}/dist
          tar czf ../../../${{ matrix.name }}.tar.gz slocate
          cd ../../..
          openssl dgst -sha256 -r ${{ matrix.name }}.tar.gz | awk '{print $1}' > ${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: version
        run: |
          # branch is release/v0.1.0 → tag is v0.1.0
          VERSION="${GITHUB_REF_NAME#release/}"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          # Allow hotfix pushes to replace assets
          make_latest: true
          files: |
            *.tar.gz
            *.sha256
